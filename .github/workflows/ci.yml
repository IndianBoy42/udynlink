name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: pre
      run: |
        sudo apt-get install -y gcc-arm-none-eabi cmake
        pip install subprocess32 pyelftools Jinja2
    - name: test
      run: |
        cd tests 
        python ./test_driver.py