[project]
name = "udynlink"
version = "0.1.0"
description = "Micro dynamic linker for ARM Cortex-M MCUs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyelftools",
    "Jinja2",
    "colorama",
    "termcolor",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring the ARM cross-compiler (arm-none-eabi-gcc)",
]

[tool.uv]
package = false
